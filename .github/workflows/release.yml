name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "v*.*.*"

jobs:
  build_plugin:
    runs-on: ubuntu-latest
    # container:
    #   image: archlinux:latest
    steps:
      - name: set git global safe directory
        run: |
          # pacman -Syu git tree zip unzip upx --noconfirm
          sudo apt-get update
          sudo apt-get install -y git tree zip unzip upx
          git config --global --add safe.directory $(realpath .)

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup PNPM@9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Extract project name
        id: extract-project-name
        run: echo "project_name=$(jq -r '.name' package.json)" >> $GITHUB_OUTPUT

      - name: Extract project version
        id: extract-project-version
        run: echo "project_version=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Setup Rust
        run: rustup update

      - name: Build backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: build plugin
        run: |
          pnpm install --no-frozen-lockfile
          pnpm update
          pnpm run build

      - name: Compress backend
        run: |
          mkdir -p backend/bin
          cp -f backend/target/release/wine-cask backend/bin/backend
          # upx
          chmod +x backend/bin/backend
          upx -9 backend/bin/backend

      - name: Compress frontend
        run: |
          rm -f dist/*.js.map
          PROJECT_NAME=${{ steps.extract-project-name.outputs.project_name }}
          mkdir bin
          cp -f backend/bin/backend bin/backend
          mkdir -p ${PROJECT_NAME}
          # zip
          cp -r dist py_modules bin *.py *.json *.md *.js LICENSE ${PROJECT_NAME}
          zip -r ${PROJECT_NAME}.zip ${PROJECT_NAME}


      - name: show files
        run: |
          ls -R ${PROJECT_NAME}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.extract-project-name.outputs.project_name }}-${{ steps.extract-project-version.outputs.project_version }}
          compression-level: 0
          path: |
            ${{ steps.extract-project-name.outputs.project_name }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - run: mkdir /tmp/artifacts

      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: publish to github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/artifacts/*/*.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          prerelease: contains(github.ref, 'pre')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
